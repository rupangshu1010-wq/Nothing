name: Build project

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - idf_ver: release-v5.5
            target: esp32s3
            preview: ""
          - idf_ver: release-v6.1
            target: esp32s3
            preview: ""
            
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf_ver }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Build ${{ matrix.target }} with ESP-IDF ${{ matrix.idf_ver }}
        shell: bash
        run: |
          . ${IDF_PATH}/export.sh
          idf.py ${{ matrix.preview }} \
            -B build-${{ matrix.target }} \
            -D IDF_TARGET=${{ matrix.target }} \
            build

      - name: Upload Built Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp-drone-binaries-${{ matrix.target }}-${{ matrix.idf_ver }}
          path: |
            build-${{ matrix.target }}/*.bin
            build-${{ matrix.target }}/bootloader/bootloader.bin
            build-${{ matrix.target }}/partition_table/partition-table.bin
          if-no-files-found: error
